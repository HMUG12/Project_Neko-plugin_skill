[plugin]
id = "web_assistant"
name = "网页助手"
description = "示例插件：演示深函数封装、设置面板、@llm_tool 联网、URL 输入预筛选与防御性入口。整合本 skill 40–45 的融合精髓。"
short_description = "Demo: deep-module entry, settings panel, @llm_tool, URL input pre-filter."
keywords = ["网页", "web", "搜索", "search", "示例", "demo"]
version = "0.1.0"
entry = "plugin.plugins.web_assistant:WebAssistantPlugin"

[plugin.author]
name = "neko-plugin-dev skill (示例)"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

# 第三方依赖（v0.9 内联表格式，必填用于 check --strict 通过）
[plugin.dependencies]
firecrawl = ">=1.0.0"

[plugin.ui]
# UI 设置面板：官方格式要求 entry 指向资源，title 而非 label
[[plugin.ui.panel]]
id = "main"
title = "网页助手"
entry = "ui/settings.tsx"
context = "dashboard"
permissions = ["state:read", "action:call", "config:read"]

# 自定义配置段（段名可任意，官方允许非保留的顶层节）：
# 与 __init__.py 中 self.config.dump()["web_assistant"] 读取的 key 对应。
# ⚠️ firecrawl_api_key 不应硬编码/提交到仓库；真实 Key 由用户在设置面板填入，
#    落在用户数据目录的运行时配置里。源码这里只放空默认值/占位。
# 建议同时提供 config.example.toml 作为模板（字段 + 注释），供用户复制填写。
[web_assistant]
firecrawl_api_key = ""      # 留空：运行时通过设置面板填入
firecrawl_api_url = ""      # 自建/代理地址，留空用官方
default_city = ""           # 默认城市
search_limit = 5            # 搜索默认返回条数
request_timeout = 30        # 单页超时（秒，预留）
